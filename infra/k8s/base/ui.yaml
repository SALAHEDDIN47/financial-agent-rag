apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-ui
  namespace: financial-rag
  labels:
    app: rag-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-ui
  template:
    metadata:
      labels:
        app: rag-ui
    spec:
      containers:
        - name: ui
          image: financial-agent-rag-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
          env:
            - name: API_URL
              value: "http://rag-api:8000/api/ask"
          resources:
            requests: { memory: "1Gi", cpu: "500m" }
            limits:   { memory: "2Gi", cpu: "1" }
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rag-ui
  namespace: financial-rag
spec:
  selector:
    app: rag-ui
  ports:
    - port: 8501
      targetPort: 8501
  type: ClusterIP