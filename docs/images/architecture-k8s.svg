<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="820" fill="#ffffff"/>
  <text x="600" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Kubernetes Hybrid Architecture (Docker Desktop)</text>
  <text x="600" y="60" text-anchor="middle" font-size="13" fill="#64748b">API + UI in pods · infrastructure and LLM on the host — Strangler Fig migration pattern</text>

  <!-- HOST -->
  <rect x="40" y="84" width="1120" height="250" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="60" y="108" font-size="13" font-weight="700" fill="#334155">WINDOWS HOST</text>

  <rect x="70" y="126" width="300" height="70" rx="8" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="220" y="154" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">NVIDIA </text>
  <text x="220" y="174" text-anchor="middle" font-size="11.5" fill="#047857">4 GB VRAM (partial offload, rest in RAM)</text>

  <rect x="70" y="214" width="300" height="100" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="220" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">Ollama :11434</text>
  <text x="220" y="266" text-anchor="middle" font-size="11.5" fill="#92400e">Qwen 2.5 14B</text>
  <text x="220" y="286" text-anchor="middle" font-size="11" fill="#92400e">OLLAMA_HOST=0.0.0.0 · OLLAMA_ORIGINS=*</text>
  <line x1="220" y1="214" x2="220" y2="196" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect x="420" y="126" width="710" height="188" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="440" y="150" font-size="12.5" font-weight="700" fill="#1e3a8a">Docker Compose — infrastructure</text>
  <g font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">
    <rect x="445" y="168" width="160" height="62" rx="8" fill="#fff" stroke="#60a5fa"/><text x="525" y="195">Milvus</text><text x="525" y="214" font-size="11" font-weight="400" fill="#1d4ed8">:19530 (gRPC)</text>
    <rect x="625" y="168" width="160" height="62" rx="8" fill="#fff" stroke="#60a5fa"/><text x="705" y="195">Elasticsearch</text><text x="705" y="214" font-size="11" font-weight="400" fill="#1d4ed8">:9200 (HTTP)</text>
    <rect x="805" y="168" width="160" height="62" rx="8" fill="#fff" stroke="#60a5fa"/><text x="885" y="195">MinIO</text><text x="885" y="214" font-size="11" font-weight="400" fill="#1d4ed8">:9000 (S3)</text>
    <rect x="985" y="168" width="125" height="62" rx="8" fill="#fff" stroke="#60a5fa"/><text x="1047" y="195">Kibana</text><text x="1047" y="214" font-size="11" font-weight="400" fill="#1d4ed8">+ etcd</text>
  </g>
  <text x="780" y="268" text-anchor="middle" font-size="12" fill="#475569">Reached from pods via</text>
  <text x="780" y="288" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">192.168.65.254  (host.docker.internal)</text>

  <!-- connector host -> k8s -->
  <line x1="780" y1="334" x2="780" y2="398" stroke="#475569" stroke-width="2.5" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="796" y="372" font-size="11.5" fill="#475569">network requests</text>

  <!-- K8S -->
  <rect x="40" y="398" width="1120" height="400" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
  <text x="60" y="422" font-size="13" font-weight="700" fill="#3730a3">KUBERNETES (Docker Desktop)</text>

  <rect x="70" y="440" width="1060" height="56" rx="10" fill="#ffffff" stroke="#818cf8" stroke-width="2"/>
  <text x="600" y="464" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">Ingress NGINX 1.10.0</text>
  <text x="600" y="483" text-anchor="middle" font-size="11.5" fill="#475569">http://rag.local  ·  /  → rag-ui   ·  /api → rag-api   (or kubectl port-forward)</text>

  <rect x="70" y="520" width="1060" height="260" rx="10" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="90" y="544" font-size="12.5" font-weight="700" fill="#5b21b6">Namespace: financial-rag</text>

  <rect x="110" y="562" width="360" height="130" rx="10" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
  <text x="290" y="588" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">Deployment: rag-api</text>
  <text x="290" y="610" text-anchor="middle" font-size="11.5" fill="#475569">FastAPI + LangGraph · CPU (FORCE_DEVICE=cpu)</text>
  <text x="290" y="630" text-anchor="middle" font-size="11.5" fill="#475569">Service rag-api :8000 · 1 replica</text>
  <text x="290" y="650" text-anchor="middle" font-size="11.5" fill="#475569">long liveness / readiness delays</text>
  <text x="290" y="670" text-anchor="middle" font-size="11.5" fill="#475569">(embedding + reranker loading)</text>

  <rect x="560" y="562" width="300" height="130" rx="10" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
  <text x="710" y="588" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">Deployment: rag-ui</text>
  <text x="710" y="612" text-anchor="middle" font-size="11.5" fill="#475569">Streamlit</text>
  <text x="710" y="632" text-anchor="middle" font-size="11.5" fill="#475569">Service rag-ui :8501 · 1 replica</text>
  <line x1="560" y1="627" x2="470" y2="627" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- config -->
  <g font-size="12" fill="#334155">
    <rect x="900" y="562" width="200" height="38" rx="8" fill="#fff" stroke="#c4b5fd"/><text x="1000" y="586" text-anchor="middle">ConfigMap · env variables</text>
    <rect x="900" y="610" width="200" height="38" rx="8" fill="#fff" stroke="#c4b5fd"/><text x="1000" y="634" text-anchor="middle">Secret · MinIO credentials</text>
    <rect x="900" y="658" width="200" height="38" rx="8" fill="#fff" stroke="#c4b5fd"/><text x="1000" y="682" text-anchor="middle">PVC 10 Gi · HF cache</text>
  </g>
  <text x="1000" y="554" text-anchor="middle" font-size="11" fill="#5b21b6">read by rag-api</text>

  <!-- external service -->
  <rect x="110" y="716" width="750" height="46" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="485" y="736" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7c2d12">Service + Endpoints: ollama-external → 192.168.65.254</text>
  <text x="485" y="753" text-anchor="middle" font-size="11" fill="#9a3412">HTTP Ollama · gRPC Milvus · HTTP Elasticsearch</text>
  <line x1="290" y1="692" x2="290" y2="716" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- ingress arrows -->
  <line x1="290" y1="496" x2="290" y2="562" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="710" y1="496" x2="710" y2="562" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
</svg>
