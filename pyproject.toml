[project]
name = "financial-agent-rag"
version = "0.1.0"
description = "Augmented Financial Analyst Agent with RAG"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "streamlit>=1.29.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "pandas>=2.1.0",
    "pyarrow>=14.0.0",
    "pyspark>=3.5.0",
    "unstructured[html,pdf]>=0.10.0",
    "pdfplumber>=0.10.0",
    "camelot-py>=0.11.0",
    "opencv-python>=4.8.0",
    "pymilvus>=2.3.0",
    "boto3>=1.34.0",
    "langchain>=0.1.0",
    "langgraph>=0.0.20",
    "sentence-transformers>=2.2.0",
    "transformers>=4.36.0",
    "torch>=2.1.0",
    "sec-edgar-api>=0.1.0",
    "unstructured-inference>=1.2.0",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.2",
    "html5lib>=1.1",
    "sec-edgar-downloader>=5.1.0",
    "yfinance>=1.6.0",
    "datasets>=5.0.1",
    "playwright>=1.62.0",
    "setuptools>=84.0.0",
    "undetected-playwright>=0.3.0",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "langchain-text-splitters>=1.1.2",
    "fastembed>=0.8.0",
    "elasticsearch>=8.0.0,<9.0.0",
    "langchain-core>=1.6.0",
    "langchain-google-genai>=4.3.6",
    "google-generativeai>=0.8.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# === AJOUT CRUCIAL : dit à Hatchling d'empaqueter tout src/ ===
[tool.hatch.build.targets.wheel]
packages = ["src"]
